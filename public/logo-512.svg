<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <!-- Background Radial Ambient Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#08090C" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Shield Gradient -->
    <linearGradient id="shieldGrad512" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="40%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <!-- Inner Core Gradient -->
    <linearGradient id="coreGrad512" x1="160" y1="160" x2="352" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Subtle Bevel Gradient -->
    <linearGradient id="borderGrad512" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#312E81" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E1B4B" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="coreGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- App Icon Background (Squircle) -->
  <rect width="512" height="512" rx="112" fill="#08090C" />
  
  <!-- Ambient Center Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#ambientGlow)" />
  
  <!-- Outer Subtle Stroke Border -->
  <rect x="2" y="2" width="508" height="508" rx="110" stroke="url(#borderGrad512)" stroke-width="3" />

  <!-- Outer Isometric Vault Shield -->
  <path
    d="M256 64L80 152V312L256 416L432 312V152L256 64Z"
    stroke="url(#shieldGrad512)"
    stroke-width="22"
    stroke-linejoin="round"
    stroke-linecap="round"
  />

  <!-- Top Prism Facet Accent -->
  <path
    d="M256 64L256 256L432 152"
    stroke="url(#shieldGrad512)"
    stroke-width="8"
    stroke-opacity="0.35"
    stroke-linejoin="round"
  />

  <!-- Inner Cryptographic Zero-Knowledge Core (Shield) -->
  <path
    d="M256 160L168 208V288L256 336L344 288V208L256 160Z"
    fill="url(#coreGrad512)"
    fill-opacity="0.28"
    stroke="url(#coreGrad512)"
    stroke-width="18"
    stroke-linejoin="round"
    filter="url(#coreGlow)"
  />

  <!-- Central Locking Quantum Node -->
  <circle cx="256" cy="248" r="24" fill="#38BDF8" filter="url(#nodeGlow)" />
  <circle cx="256" cy="248" r="10" fill="#FFFFFF" />
</svg>

